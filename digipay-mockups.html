<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digipay Merchant UX — Discovery Mockups</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap");
    :root {
      --dp: #3DDBB0;
      --dp-dark: #2BB896;
      --dp-deep: #1A8F6E;
      --dp-light: #E8FBF5;
      --dp-muted: #B8F0DE;
      --ink: #131B23;
      --muted: #5C6B7A;
      --border: #E2E8F0;
      --bg: #F4F7FA;
      --card: #FFFFFF;
      --amber: #F59E0B;
      --amber-bg: #FEF3C7;
      --green: #10B981;
      --green-bg: #ECFDF5;
      --red: #EF4444;
      --red-bg: #FEE2E2;
      --shadow: 0 4px 24px rgba(19, 27, 35, 0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Vazirmatn", "IRANSansX", "IRANSans", "Yekan Bakh", Tahoma, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .app-shell { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--ink);
      color: #fff;
      padding: 24px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar h1 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .sidebar .sub { font-size: 11px; opacity: 0.65; margin-bottom: 20px; line-height: 1.4; }
    .sidebar label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.55;
      margin: 14px 0 6px;
    }
    .sidebar select, .sidebar .seg-pick {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .sidebar select option { color: var(--ink); }
    .level-btns { display: flex; flex-direction: column; gap: 6px; }
    .level-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #fff;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }
    .level-btn:hover { background: rgba(255,255,255,0.08); }
    .level-btn.active { background: var(--dp); color: var(--ink); border-color: var(--dp); font-weight: 600; }
    .level-btn .tag { font-size: 10px; opacity: 0.75; display: block; margin-top: 2px; }
    .page-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .page-btn {
      flex: 1;
      min-width: 80px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .page-btn.active { background: var(--dp); color: var(--ink); border-color: var(--dp); font-weight: 600; }
    .seg-meta {
      margin-top: 16px;
      padding: 12px;
      background: rgba(61, 219, 176, 0.12);
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
      border: 1px solid rgba(61, 219, 176, 0.25);
    }
    .seg-meta strong { color: var(--dp); }
    .main { padding: 24px 32px 48px; overflow-x: auto; }
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .main-header h2 { font-size: 20px; }
    .main-header p { font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 560px; }
    .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--dp-light);
      color: var(--dp-deep);
      font-weight: 600;
    }
    .badge.warn { background: var(--amber-bg); color: #92400E; }
    .badge.lock { background: var(--red-bg); color: #991B1B; }
    .phone-frame {
      max-width: 1100px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .merchant-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .merchant-name { font-weight: 700; font-size: 16px; }
    .dp-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--dp-light);
      color: var(--dp-deep);
    }
    .dp-pill.l0 { background: var(--amber-bg); color: #92400E; }
    .dp-pill.l2 { background: var(--red-bg); color: #991B1B; }
    .page-body { padding: 20px; }
    /* PDP */
    .pdp-layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
    @media (max-width: 700px) { .pdp-layout { grid-template-columns: 1fr; } }
    .pdp-img {
      aspect-ratio: 1;
      background: linear-gradient(145deg, var(--dp-light), var(--dp-muted));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
    }
    .pdp-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .pdp-meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .pdp-price { font-size: 26px; font-weight: 800; margin-bottom: 16px; }
    .dp-block {
      border: 1.5px solid var(--dp);
      border-radius: 12px;
      padding: 16px;
      background: var(--dp-light);
      margin-bottom: 16px;
    }
    .dp-block.l0 { border-color: var(--amber); background: var(--amber-bg); }
    .dp-block.l2 { border-color: var(--red); background: var(--red-bg); }
    .dp-block.hosted { border-style: dashed; background: #fff; }
    .dp-block-head { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .dp-block.l2 .dp-block-head { color: #991B1B; }
    .dp-block.l0 .dp-block-head { color: #92400E; }
    .dp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
      border-top: 1px dashed rgba(0,0,0,0.06);
    }
    .dp-row:first-of-type { border-top: 0; }
    .ok { color: var(--green); font-weight: 600; }
    .warn-t { color: #B45309; font-weight: 600; }
    .no { color: var(--red); font-weight: 600; }
    .cta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .cta {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .cta-primary { background: var(--dp-deep); color: #fff; }
    .cta-amber { background: var(--amber); color: #fff; }
    .cta-danger { background: var(--red); color: #fff; }
    .cta-ghost { background: #fff; color: var(--dp-deep); border: 1.5px solid var(--dp); }
    .buy-row { display: flex; gap: 10px; margin-top: 8px; }
    .btn-cart {
      padding: 12px 20px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-outline {
      padding: 12px 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    /* PLP */
    .plp-top {
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .plp-top.l0 { background: var(--amber-bg); border: 1px solid var(--amber); }
    .plp-top.l1 { background: var(--green-bg); border: 1px solid var(--green); }
    .plp-top.l2 { background: var(--red-bg); border: 1px solid var(--red); }
    .plp-top h3 { font-size: 15px; }
    .plp-top p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .plp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    @media (max-width: 900px) { .plp-grid { grid-template-columns: repeat(2, 1fr); } }
    .plp-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fff;
    }
    .plp-thumb {
      height: 120px;
      background: linear-gradient(145deg, var(--dp-light), var(--dp-muted));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 10px;
    }
    .plp-card-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .plp-card-price { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    .plp-tag {
      font-size: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      font-weight: 600;
      line-height: 1.3;
    }
    .plp-tag.ok { background: var(--dp-light); color: var(--dp-deep); }
    .plp-tag.warn { background: var(--amber-bg); color: #92400E; }
    .plp-tag.lock { background: var(--red-bg); color: #991B1B; }
    /* Checkout */
    .checkout-layout { display: grid; grid-template-columns: 1fr 320px; gap: 24px; }
    @media (max-width: 800px) { .checkout-layout { grid-template-columns: 1fr; } }
    .level-strip {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .level-strip.l0 { background: var(--amber-bg); border: 1px solid var(--amber); }
    .level-strip.l2 { background: var(--red-bg); border: 1px solid var(--red); }
    .level-strip h4 { font-size: 14px; }
    .level-strip p { font-size: 12px; color: var(--muted); }
    .level-strip .cta { margin-left: auto; }
    .pay-method {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .pay-method.selected { border-color: var(--dp-deep); background: var(--dp-light); }
    .pay-method.recommended { border-color: var(--green); }
    .pay-method.disabled { opacity: 0.55; background: #F8FAFC; cursor: not-allowed; }
    .pay-method-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      gap: 8px;
    }
    .method-pill {
      font-size: 9px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      color: #fff;
    }
    .method-pill.rec { background: var(--green); }
    .method-pill.fast { background: var(--amber); }
    .method-pill.lock { background: var(--red); }
    .pay-method-body { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
    .summary-box {
      background: #F8FAFC;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
    }
    .summary-box h4 { font-size: 14px; margin-bottom: 12px; }
    .sum-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; }
    .sum-row.total { font-weight: 700; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 12px; }
    .sum-note {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
    }
  .sum-note.dp { background: var(--dp-light); color: var(--dp-deep); }
  .sum-note.warn { background: var(--red-bg); color: #991B1B; }
    .confirm-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: var(--dp-deep);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .hosted-btn {
      width: 100%;
      padding: 16px;
      background: var(--dp);
      color: var(--ink);
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      margin: 16px 0;
    }
    .iframe-placeholder {
      border: 2px dashed var(--dp);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      background: #FAFFFE;
      color: var(--muted);
      font-size: 12px;
    }
    .service-pdp .service-route {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .service-estimate {
      font-size: 13px;
      padding: 10px 12px;
      background: #F8FAFC;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px dashed var(--border);
    }
    .legend {
      margin-top: 24px;
      max-width: 1100px;
      padding: 16px;
      background: #FFFBEB;
      border-left: 4px solid var(--amber);
      border-radius: 0 8px 8px 0;
      font-size: 12px;
      color: #78350F;
      line-height: 1.6;
    }
    .legend ul { margin: 8px 0 0 18px; }
    [dir="rtl"] .sidebar { text-align: right; }
    [dir="rtl"] .dp-row { flex-direction: row-reverse; }
    .dk-shell { background: #F0F0F1; border-top: 1px solid var(--border); }
    .dk-top-banner {
      background: #EF394E;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 7px 12px;
    }
    .dk-header {
      background: #fff;
      border-bottom: 1px solid #E0E0E6;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .dk-header-row {
      display: grid;
      grid-template-columns: 150px 1fr 180px;
      gap: 12px;
      align-items: center;
    }
    .dk-logo { color: #EF394E; font-weight: 800; font-size: 22px; letter-spacing: 0.2px; }
    .dk-search {
      background: #F0F0F1;
      border: 1px solid #E0E0E6;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #81858B;
    }
    .dk-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      font-size: 11px;
      color: #3f4064;
    }
    .dk-chip {
      border: 1px solid #E0E0E6;
      border-radius: 8px;
      padding: 7px 9px;
      background: #fff;
      font-weight: 600;
    }
    .dk-nav {
      display: flex;
      gap: 18px;
      font-size: 11px;
      color: #62666D;
      padding: 9px 0 2px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .dk-nav strong { color: #EF394E; }
    .dk-container { padding: 16px; }
    .dk-card {
      background: #fff;
      border: 1px solid #E0E0E6;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .dk-breadcrumb {
      font-size: 11px;
      color: #81858B;
      margin-bottom: 12px;
    }
    .dk-pdp {
      display: grid;
      grid-template-columns: 43% 57%;
      gap: 14px;
    }
    .dk-gallery {
      background: #fff;
      border: 1px solid #E0E0E6;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .dk-main-image {
      height: 260px;
      border-radius: 10px;
      background: linear-gradient(145deg, #F9FAFB, #EEF2F6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      margin-bottom: 10px;
    }
    .dk-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .dk-thumb {
      height: 44px;
      border: 1px solid #E0E0E6;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-size: 18px;
    }
    .dk-info h3 {
      font-size: 18px;
      color: #3f4064;
      margin-bottom: 6px;
      line-height: 1.7;
    }
    .dk-sub {
      font-size: 12px;
      color: #81858B;
      margin-bottom: 9px;
    }
    .dk-price {
      font-size: 24px;
      color: #3f4064;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .dk-buybox {
      background: #F8FAFC;
      border: 1px solid #E0E0E6;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .dk-red-btn {
      width: 100%;
      background: #EF394E;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      padding: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    .dk-row-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .dk-item {
      border: 1px solid #E0E0E6;
      border-radius: 10px;
      background: #fff;
      padding: 9px;
    }
    .dk-item-image {
      height: 96px;
      border-radius: 8px;
      background: linear-gradient(145deg, #F8FAFC, #F1F5F9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 8px;
    }
    .dk-item-title { font-size: 11px; color: #3f4064; min-height: 30px; }
    .dk-item-price { font-size: 13px; color: #3f4064; font-weight: 700; margin-top: 5px; }
    .dk-off {
      margin-top: 6px;
      display: inline-block;
      border-radius: 6px;
      background: #FEE2E2;
      color: #B91C1C;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 6px;
    }
    .dk-checkout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 12px;
    }
    .dk-steps {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: #81858B;
      margin-bottom: 10px;
    }
    .dk-step {
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid #E0E0E6;
      background: #fff;
    }
    .dk-step.active {
      background: #E8FBF5;
      border-color: #3DDBB0;
      color: #1A8F6E;
      font-weight: 700;
    }
    .dk-order {
      border: 1px solid #E0E0E6;
      border-radius: 10px;
      padding: 11px;
      background: #fff;
      margin-bottom: 10px;
    }
    .dk-order-head {
      font-size: 12px;
      font-weight: 700;
      color: #3f4064;
      margin-bottom: 8px;
    }
    @media (max-width: 980px) {
      .dk-pdp, .dk-checkout { grid-template-columns: 1fr; }
      .dk-row-list { grid-template-columns: repeat(2, 1fr); }
      .dk-header-row { grid-template-columns: 120px 1fr; }
      .dk-actions { display: none; }
    }
    .rtl-toggle {
      margin-top: 12px;
      padding: 8px 12px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .service-list-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: 11px;
      line-height: 1.6;
    }
    .service-list-box h4 {
      font-size: 11px;
      margin-bottom: 6px;
      color: var(--dp);
      font-weight: 700;
    }
    .service-list-box ul {
      margin: 0;
      padding-inline-start: 16px;
    }
    .service-list-box li { margin-bottom: 3px; }
    .svc-btn {
      width: 100%;
      text-align: start;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      cursor: pointer;
      margin-bottom: 5px;
    }
    .svc-btn:hover { background: rgba(255,255,255,0.12); }
    .svc-btn.active {
      background: rgba(61, 219, 176, 0.2);
      border-color: rgba(61, 219, 176, 0.5);
      color: #D1FAEC;
      font-weight: 700;
    }
    .service-doc-box {
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.12);
      color: #E5E7EB;
    }
    .service-doc-box h5 {
      font-size: 11px;
      color: #A7F3D0;
      margin-bottom: 6px;
    }
    .service-doc-box .doc-line {
      font-size: 10px;
      margin-bottom: 5px;
      line-height: 1.55;

    function getInstallmentPlanPreview(totalAmountText) {
      const base = new Date();
      const steps = [];
      for (let i = 0; i < 4; i++) {
        const d = new Date(base);
        d.setMonth(base.getMonth() + i);
        const label = d.toLocaleDateString(state.rtl ? "fa-IR" : "en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
        steps.push({
          idx: i + 1,
          due: label,
          amount: state.rtl ? `۴,۶۲۵,۰۰۰ IRR` : `4,625,000 IRR`,
          isFirst: i === 0,
        });
      }
      return {
        title: state.rtl ? "برنامه پرداخت ۴ قسطی" : "4-installment schedule",
        subtitle: state.rtl ? `جمع سفارش: ${totalAmountText}` : `Order total: ${totalAmountText}`,
        steps,
      };
    }

          </div>
        </div>
      `;
    }

    function parseAmount(text) {
      const digits = (text || "").replace(/[^\d]/g, "");
      return digits ? Number(digits) : BASKET;
    }

    function get4PayFormulaPlan(totalAmount, creditBalance) {
      const creditPayment = Math.min(totalAmount, Math.round(creditBalance * 0.75));
      const debitPayment = Math.max(0, totalAmount - creditPayment);
      const installment = Math.ceil(creditPayment / 4);
      const dueDates = [];
      const base = new Date();
      for (let i = 0; i < 4; i++) {
        const d = new Date(base);
        d.setMonth(base.getMonth() + i);
        dueDates.push(
          d.toLocaleDateString(state.rtl ? "fa-IR" : "en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          })
        );
      }
      return { creditPayment, debitPayment, installment, dueDates };
    }

      const totalAmount = parseAmount(totalAmountText);

            <div class="dk-logo">${s.merchant}</div>
            <div class="dk-search">🔍 ${searchText}</div>
            <div class="dk-actions">
              <div class="dk-chip">${state.rtl ? "ورود | ثبت‌نام" : "Login | Register"}</div>
              <div class="dk-chip">🛒</div>
            </div>
          </div>
          <div class="dk-nav">
            <strong>${state.rtl ? "شگفت‌انگیزها" : "Amazing Deals"}</strong>
            <span>${state.rtl ? "سوپرمارکت" : "Supermarket"}</span>
            <span>${state.rtl ? "کالای دیجیتال" : "Digital"}</span>
            <span>${state.rtl ? "خانه و آشپزخانه" : "Home"}</span>
            <span>${state.rtl ? "مد و پوشاک" : "Fashion"}</span>
          </div>
        </div>`;
    }

    function isService(s) { return s.finalization === "after"; }
    function isLow(s) { return s.dev === "low"; }
    function isMid(s) { return s.dev === "mid"; }

    /* ——— LOW CODE: hosted button only ——— */
    function lowHostedBlock(s, level, page) {
      const apply = state.rtl ? "پرداخت با دیجی‌پی" : "Pay with Digipay";
      const sub =
        level === "0"
          ? state.rtl ? "درخواست اعتبار و پرداخت در صفحه دیجی‌پی" : "Apply & pay on Digipay-hosted page"
          : level === "2"
          ? state.rtl ? "بازپرداخت بدهی سپس پرداخت در دیجی‌پی" : "Repay debt, then complete payment on Digipay"
          : state.rtl ? "انتخاب روش (کیف پول / ۱پی / ۴پی) در دیجی‌پی" : "Choose Wallet / 1pay / 4pay on Digipay";
      return `
        <div class="dp-block hosted">
          <div class="dp-block-head">🔗 ${state.rtl ? "صفحه میزبانی‌شده دیجی‌پی" : "Digipay hosted checkout"}</div>
          <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">
            ${state.rtl ? "فروشنده به موجودی کاربر دسترسی ندارد. تمام UX در سطح دیجی‌پی." : "Merchant has no balance/debt API access. Full UX on Digipay surface."}
          </p>
          <button type="button" class="hosted-btn">${apply}</button>
          <p style="font-size:11px;color:var(--muted);text-align:center;">${sub}</p>
        </div>`;
    }

    /* ——— MID CODE: iframe widget ——— */
    function midWidget(s, level) {
      const inner =
        level === "0"
          ? state.rtl ? "ویجت: فعال‌سازی اعتبار برای همین خرید" : "Widget: Apply for credit for this basket"
          : level === "1"
          ? state.rtl ? "ویجت: نمایش روش‌های قابل پرداخت برای این مبلغ" : "Widget: Sufficient / insufficient per method"
          : state.rtl ? "ویجت: بازپرداخت بدهی و بازگشت به پرداخت" : "Widget: Repay → return to basket";
      return `
        <div class="iframe-placeholder">
          <strong>${state.rtl ? "ویجت دیجی‌پی (SDK / iframe)" : "Digipay drop-in widget"}</strong><br/>
          ${inner}<br/>
          <span style="font-size:10px;margin-top:8px;display:block;">${s.trusted ? (state.rtl ? "Trusted: با اعداد" : "Trusted: with figures") : state.rtl ? "Not trusted: فقط کافی/ناکافی" : "Not trusted: sufficiency only"}</span>
        </div>`;
    }

    function methodRow(name, detail, status, trusted) {
      const st = status === "ok" ? "ok" : status === "warn" ? "warn-t" : "no";
      const label = status === "ok" ? (state.rtl ? "✓ قابل پرداخت" : "✓ Sufficient") : status === "warn" ? (state.rtl ? "⚠ نیاز به تکمیل با IPG" : "⚠ Partial") : state.rtl ? "✗ کافی نیست" : "✗ Insufficient";
      return `<div class="dp-row"><span><strong>${name}</strong> ${detail ? "· " + detail : ""}</span><span class="${st}">${label}</span></div>`;
    }

    function trustedDetail(s, level) {
      if (!s.trusted) {
        if (level === "1") {
          return `
            ${methodRow("4pay", state.rtl ? "۴ قسط" : "4 installments", "ok")}
            ${methodRow("1pay", state.rtl ? "پرداخت سریع و یک‌مرحله‌ای" : "rapid one-step payment", "ok")}
            ${methodRow("Wallet", state.rtl ? "با IPG" : "+ IPG uplift", "warn")}
          `;
        }
        return "";
      }
      if (level === "1") {
        return `
          ${methodRow("4pay", state.rtl ? `۴ × ${INST_4}` : `4 × ${INST_4} IRR`, "ok")}
          ${methodRow("1pay", state.rtl ? "پرداخت سریع و یک‌مرحله‌ای" : "rapid one-step payment", "ok")}
          ${methodRow("Wallet", state.rtl ? "+185,000 کش‌بک" : "+185,000 cashback", "warn")}
        `;
      }
      return "";
    }

    /* ——— PDP ——— */
    function renderPDP(s, level) {
      const c = merchantContent(s);
      if (isLow(s)) {
        return `<div class="dk-shell">${digikalaLikeHeader(s)}<div class="dk-container"><div class="dk-card">${isService(s) ? serviceHeader(s) : productHeader(s)}${lowHostedBlock(s, level, "pdp")}<button class="dk-red-btn">${state.rtl ? "افزودن به سبد خرید" : "Add to cart"}</button></div></div></div>`;
      }

      let block = "";
      if (level === "0") {
        block = `
          <div class="dp-block l0">
            <div class="dp-block-head">⚡ ${state.rtl ? "الان بخر، بعداً ۴ قسط بده" : "Buy now, pay in 4 with Digipay"}</div>
            <p style="font-size:13px;margin-bottom:8px;">${state.rtl ? `این خرید ${BASKET_FMT} را به ۴ قسط تقسیم کنید.` : `Split this ${BASKET_FMT} purchase into 4 payments.`}</p>
            ${s.trusted ? `<div class="dp-row"><span>${state.rtl ? "زمان تأیید" : "Approval"}</span><strong>~30s</strong></div>` : ""}
            ${installmentPreviewCard(c.price || BASKET_FMT)}
            <div class="cta-row"><a class="cta cta-amber" href="#">${state.rtl ? "درخواست اعتبار دیجی‌پی ←" : "Apply for Digipay credit →"}</a></div>
          </div>`;
      } else if (level === "1") {
        const head = state.rtl ? "دیجی‌پی · روش‌های مناسب برای شما" : "Digipay · You're covered";
        block = `
          <div class="dp-block">
            <div class="dp-block-head">⚡ ${head}</div>
            ${isMid(s) ? midWidget(s, level) : trustedDetail(s, level)}
            ${fourPayFormulaCard(c.price || BASKET_FMT)}
            ${!isMid(s) ? `<div class="cta-row">
              <a class="cta cta-primary" href="#">${state.rtl ? "خرید سریع با ۱پی (۱ کلیک)" : "Fast checkout with 1pay (1 click) →"}</a>
              <a class="cta cta-ghost" href="#">${state.rtl ? "انتخاب روش" : "Choose method"}</a>
            </div>` : ""}
          </div>`;
      } else {
        block = `
          <div class="dp-block l2">
            <div class="dp-block-head">🔒 ${state.rtl ? "اعتبار قفل است" : "Digipay credit locked"}</div>
            <p style="font-size:13px;">${s.trusted
              ? state.rtl ? `شما <strong>${fmt(DEBT, true)}</strong> بدهی دارید. با بازپرداخت، ۱پی و ۴پی دوباره فعال می‌شود.`
              : `Outstanding debt. Repay to unlock pay-later on this ${BASKET_FMT} item.`
              : state.rtl ? "برای پرداخت اعتباری، ابتدا بدهی خود را در دیجی‌پی تسویه کنید." : "Repay your Digipay debt to unlock 4pay / 1pay."}</p>
            ${s.trusted ? `<div class="dp-row"><span>${state.rtl ? "پس از بازپرداخت" : "After repayment"}</span><span class="ok">${state.rtl ? `→ ۴ × ${INST_4}` : `→ 4 × ${INST_4} IRR`}</span></div>` : ""}
            ${fourPayFormulaCard(c.price || BASKET_FMT)}
            <div class="cta-row">
              <a class="cta cta-danger" href="#">${state.rtl ? `بازپرداخت ${fmt(DEBT, true)} ←` : `Repay ${fmt(DEBT, true)} →`}</a>
              <a class="cta cta-ghost" href="#">${state.rtl ? "پرداخت با کیف پول" : "Pay with Wallet"}</a>
            </div>
          </div>`;
      }

      return `<div class="dk-shell">${digikalaLikeHeader(s)}<div class="dk-container"><div class="dk-breadcrumb">${state.rtl ? "دیجی‌کالا / موبایل / محصول" : "Digikala / Product details"}</div><div class="dk-pdp"><div class="dk-gallery"><div class="dk-main-image">${isService(s) ? s.icon : c.icon || "📦"}</div><div class="dk-thumbs"><div class="dk-thumb">${isService(s) ? "🗺️" : c.icon || "📦"}</div><div class="dk-thumb">📷</div><div class="dk-thumb">🎞️</div><div class="dk-thumb">➕</div></div></div><div class="dk-info"><h3>${isService(s) ? (state.rtl ? c.serviceFa : c.serviceEn) : (state.rtl ? c.titleFa : c.titleEn)}</h3><div class="dk-sub">${isService(s) ? (state.rtl ? c.estimateFa : c.estimateEn) : (state.rtl ? c.metaFa : c.metaEn)}</div><div class="dk-price">${c.price || BASKET_FMT}</div><div class="dk-buybox">${block}<button class="dk-red-btn">${state.rtl ? (isService(s) ? "ثبت درخواست سرویس" : "افزودن به سبد خرید") : isService(s) ? "Request service" : "Add to cart"}</button></div></div></div></div></div>`;
    }

    function productHeader(s) {
      const c = merchantContent(s);
      return `<div class="pdp-layout"><div class="pdp-img">${c.icon || "📦"}</div><div><h1 class="pdp-title">${state.rtl ? c.titleFa : c.titleEn}</h1><p class="pdp-meta">${state.rtl ? c.metaFa : c.metaEn}</p><div class="pdp-price">${c.price}</div></div></div>`;
    }
    function productPDPLeft(s) {
      const c = merchantContent(s);
      return `<div class="pdp-img">${c.icon || "📦"}</div>`;
    }
    function serviceHeader(s) {
      const c = merchantContent(s);
      return `<div class="service-pdp"><div class="service-route">${s.icon} ${state.rtl ? c.serviceFa : c.serviceEn}</div><div class="service-estimate">${state.rtl ? c.estimateFa : c.estimateEn}</div></div>`;
    }
    function servicePDPLeft(s) {
      return `<div class="pdp-img">${s.icon}</div>`;
    }

    /* ——— PLP ——— */
    function renderPLP(s, level) {
      const cardsHtml = plpCards(s, level)
        .replaceAll('class="plp-card"', 'class="dk-item"')
        .replaceAll('class="plp-thumb"', 'class="dk-item-image"')
        .replaceAll('class="plp-card-title"', 'class="dk-item-title"')
        .replaceAll('class="plp-card-price"', 'class="dk-item-price"')
        .replaceAll('class="plp-tag', 'class="dk-off');
      return `<div class="dk-shell">${digikalaLikeHeader(s)}<div class="dk-container"><div class="dk-card">${plpBanner(s, level)}${isLow(s) ? lowHostedBlock(s, level, "plp") : ""}${isMid(s) ? `<div style="margin:0 0 10px 0">${midWidget(s, level)}</div>` : ""}<div class="dk-row-list">${cardsHtml}</div></div></div></div>`;
    }

    function plpBanner(s, level) {
      const cls = "l" + level;
      if (level === "0") {
        return `<div class="plp-top ${cls}"><div><h3>⚡ ${state.rtl ? "الان بخر، ۴ قسط بده با دیجی‌پی" : "Buy now, pay in 4 with Digipay"}</h3><p>${state.rtl ? "یک بار درخواست، در همه خریدها" : "Apply once, use across all purchases"}</p></div><a class="cta cta-amber" href="#">${state.rtl ? "درخواست" : "Apply"}</a></div>`;
      }
      if (level === "2") {
        return `<div class="plp-top ${cls}"><div><h3>🔒 ${state.rtl ? "اعتبار دیجی‌پی قفل است" : "Digipay credit locked"}</h3><p>${s.trusted ? (state.rtl ? `بازپرداخت ${fmt(DEBT, true)} برای بازگشایی ۴پی` : `Repay ${fmt(DEBT, true)} to unlock 4pay on these items`) : state.rtl ? "بازپرداخت در دیجی‌پی" : "Repay on Digipay to unlock pay-later"}</p></div><a class="cta cta-danger" href="#">${state.rtl ? "بازپرداخت" : "Repay"}</a></div>`;
      }
      const sub = s.trusted
        ? state.rtl ? `${fmt(CREDIT_HEAD, true)} اعتبار · ۱پی و ۴پی` : `${fmt(CREDIT_HEAD, true)} credit · 1pay + 4pay ready`
        : state.rtl ? "روش‌های کافی برای سبد شما" : "Methods available for your basket";
      return `<div class="plp-top ${cls}"><div><h3>✓ ${state.rtl ? "دیجی‌پی فعال" : "Digipay active"}</h3><p>${sub}</p></div><a class="cta cta-primary" href="#">${state.rtl ? "دیجی‌پی من" : "My Digipay"}</a></div>`;
    }

    function plpCards(s, level) {
      const c = merchantContent(s);
      const items = isService(s)
        ? (c.rides || [])
            .map((it) => ({ t: state.rtl ? it.fa : it.en, p: it.p, e: it.e }))
        : (c.cards || [])
            .map((it) => ({ t: state.rtl ? it.fa : it.en, p: it.p, e: it.e }));

      return items
        .map((it) => {
          let tagClass = "ok",
            tagText = state.rtl ? `✓ ۴ × ${INST_4} با ۴پی` : `✓ 4 × ${INST_4} with 4pay`;
          if (level === "0") {
            tagClass = "warn";
            tagText = state.rtl ? `⚡ از ${INST_4}/ماه · درخواست` : `⚡ From ${INST_4}/mo · Apply`;
          } else if (level === "2") {
            tagClass = "lock";
            tagText = state.rtl ? "🔒 بازپرداخت برای ۴پی" : "🔒 Repay to unlock 4pay";
          } else if (!isService(s) && it.p !== BASKET_FMT) {
            tagClass = "warn";
            tagText = s.trusted
              ? state.rtl ? "⚠ ۴پی جزئی + کارت" : "⚠ 4pay partial + card"
              : state.rtl ? "⚠ ۴پی: کافی نیست · کیف پول ✓" : "⚠ 4pay insufficient · Wallet ✓";
          } else if (isService(s)) {
            tagText = state.rtl ? "⚡ تخمین · تسویه پس از سفر" : "⚡ Estimate · pay after trip";
            tagClass = "warn";
          }
          if (isLow(s) && level === "1") tagText = state.rtl ? "⚡ دیجی‌پی در صفحه پرداخت" : "⚡ Digipay at checkout";
          return `<div class="plp-card"><div class="plp-thumb">${it.e}</div><div class="plp-card-title">${it.t}</div><div class="plp-card-price">${it.p}</div><div class="plp-tag ${tagClass}">${tagText}</div></div>`;
        })
        .join("");
    }

    /* ——— CHECKOUT ——— */
    function renderCheckout(s, level) {
      const rightSummary = isService(s) ? serviceCheckoutSummary(s) : productCheckoutSummary(s);
      const c = merchantContent(s);
      const formulaAmount = isService(s) ? BASKET_FMT : (c.price || BASKET_FMT);
      return `<div class="dk-shell">${digikalaLikeHeader(s)}<div class="dk-container"><div class="dk-steps"><div class="dk-step ${state.page === "checkout" ? "active" : ""}">${state.rtl ? "سبد خرید" : "Cart"}</div><div class="dk-step active">${state.rtl ? "اطلاعات و پرداخت" : "Checkout"}</div><div class="dk-step">${state.rtl ? "تایید نهایی" : "Confirmation"}</div></div><div class="dk-checkout"><div><div class="dk-card">${level !== "1" ? levelStrip(s, level) : ""}${isLow(s) ? lowHostedBlock(s, level, "checkout") : ""}${isMid(s) ? `<div style="margin-bottom:10px">${midWidget(s, level)}</div>` : ""}<div class="dk-order"><div class="dk-order-head">${state.rtl ? "روش‌های پرداخت" : "Payment methods"}</div>${paymentMethods(s, level)}${(level === "1" || level === "2") ? fourPayFormulaCard(formulaAmount) : ""}</div></div></div><div>${rightSummary}</div></div></div></div>`;
    }

    function levelStrip(s, level) {
      if (level === "0") {
        return `<div class="level-strip l0"><span style="font-size:24px">⚡</span><div><h4>${state.rtl ? "اعتبار دیجی‌پی را در کمتر از ۳۰ ثانیه فعال کنید" : "Unlock pay-in-4 in ~30 seconds"}</h4><p>${state.rtl ? `برای همین خرید درخواست اعتبار ثبت کنید.` : `Apply to split this ${BASKET_FMT} purchase.`}</p>${installmentPreviewCard(BASKET_FMT)}</div><a class="cta cta-amber" href="#">${state.rtl ? "درخواست اعتبار" : "Apply"}</a></div>`;
      }
      return `<div class="level-strip l2"><span style="font-size:24px">🔒</span><div><h4>${state.rtl ? "اعتبار فعلاً قفل است؛ ابتدا بازپرداخت کنید" : "Credit locked — repay first"}</h4><p>${state.rtl ? "بعد از تسویه، به همین صفحه برمی‌گردید و می‌توانید اعتباری پرداخت کنید." : "You'll return to this basket automatically after repayment."}</p></div><a class="cta cta-amber" href="#">${state.rtl ? `تسویه بدهی ${fmt(DEBT, true)}` : `Repay ${fmt(DEBT, true)}`}</a></div>`;
    }

    function paymentMethods(s, level) {
      const disabled = level === "0" || level === "2";
      const lockLabel = level === "0" ? (state.rtl ? "نیاز به درخواست" : "Apply required") : state.rtl ? "بازپرداخت" : "Repay to unlock";
      const hide1payAfter = isService(s) && level === "1";

      let html = "";

      if (level === "1") {
        const rec4 = !hide1payAfter;
        html += payMethod({
          id: "4pay",
          title: "⚡ Digipay 4pay",
          badge: rec4 ? "rec" : null,
          badgeText: state.rtl ? "پیشنهادی" : "Recommended",
          selected: rec4,
          recommended: rec4,
          body: s.trusted
            ? isService(s)
              ? state.rtl
                ? `رزرو سقف اعتبار · تسویه نهایی بعد از اتمام سرویس · OTP`
                : `Authorize credit ceiling · capture after trip · OTP`
              : state.rtl
              ? `۴ قسط · سهم اعتباری ${fmt(CREDIT_4PAY_USE, true)} + پرداخت IPG ${fmt(IPG_TOPUP_4PAY, true)}`
              : `4 × ${INST_4} IRR · credit ${fmt(CREDIT_4PAY_USE, true)} + IPG ${fmt(IPG_TOPUP_4PAY, true)} · OTP`
            : state.rtl
            ? "✓ کافی برای این سبد · OTP"
            : "✓ Sufficient for basket · OTP",
        });
        if (!hide1payAfter) {
          html += payMethod({
            id: "1pay",
            title: "⚡ Digipay 1pay",
            badge: "fast",
            badgeText: state.rtl ? "پرداخت سریع" : "Rapid checkout",
            body: s.trusted
              ? state.rtl
              ? `پرداخت یک‌مرحله‌ای ${BASKET_FMT} · موجودی کافی`
                : `Pay ${BASKET_FMT} · balance sufficient ✓`
              : state.rtl
              ? "✓ کافی · خرید سریع"
              : "✓ Sufficient · rapid purchase",
          });
        }
        html += payMethod({
          id: "wallet",
          title: state.rtl ? "👛 کیف پول دیجی‌پی" : "👛 Digipay Wallet",
          badge: "rec",
          badgeText: state.rtl ? "کش‌بک" : "Cashback",
          body: s.trusted
            ? state.rtl
              ? `کیف پول ${fmt(WALLET, true)} + تکمیل با IPG · 185,000 کش‌بک`
              : `Balance ${fmt(WALLET, true)} + IPG uplift · +185,000 cashback`
            : state.rtl
            ? "✓ کافی با IPG · OTP"
            : "✓ Sufficient with IPG · OTP",
        });
      } else {
        html += payMethod({ id: "4pay", title: "⚡ Digipay 4pay", badge: "lock", badgeText: lockLabel, disabled: true, body: state.rtl ? "پس از فعال‌سازی / بازپرداخت" : "Available after apply / repayment" });
        html += payMethod({ id: "1pay", title: "⚡ Digipay 1pay", badge: "lock", badgeText: lockLabel, disabled: true, body: "" });
      }

      if (level === "2") {
        html += payMethod({
          id: "wallet",
          title: state.rtl ? "👛 کیف پول" : "👛 Wallet",
          badge: "rec",
          badgeText: state.rtl ? "فعال" : "Available",
          selected: true,
          body: state.rtl ? "کیف پول (دِبیت) در زمان بدهی هم قابل استفاده است" : "Debit wallet remains available during debt (policy)",
        });
      }

      // Optional competitor BNPL methods for checkout benchmarking
      if (!isService(s)) {
        html += payMethod({
          id: "snappay",
          title: state.rtl ? "🟢 اسنپ‌پی" : "🟢 SnappPay",
          badge: "fast",
          badgeText: state.rtl ? "جایگزین" : "Alternative",
          body: level === "2"
            ? (state.rtl ? "برای همین سفارش می‌توانید با اسنپ‌پی پرداخت کنید." : "Alternative BNPL option for this order.")
            : (state.rtl ? "پرداخت اعتباری با اسنپ‌پی (خارج از دیجی‌پی)." : "BNPL via SnappPay (outside Digipay)."),
        });
        html += payMethod({
          id: "tara",
          title: state.rtl ? "🟠 تارا" : "🟠 Tara",
          badge: "fast",
          badgeText: state.rtl ? "جایگزین" : "Alternative",
          body: level === "2"
            ? (state.rtl ? "گزینه اعتباری جایگزین در دسترس است." : "Alternative BNPL route is available.")
            : (state.rtl ? "پرداخت اقساطی با تارا (خارج از دیجی‌پی)." : "Installment payment via Tara (outside Digipay)."),
        });
      }

      html += payMethod({
        id: "ipg",
        title: state.rtl ? "💳 کارت بانکی" : "💳 Bank card (IPG)",
        selected: level === "0",
        body: isService(s) ? (state.rtl ? "پرداخت پس از سفر" : "Pay after service") : state.rtl ? `پرداخت ${BASKET_FMT}` : `Pay ${BASKET_FMT}`,
      });

      return html;
    }

    function payMethod(opts) {
      const cls = [opts.disabled ? "disabled" : "", opts.selected ? "selected" : "", opts.recommended ? "recommended" : ""].filter(Boolean).join(" ");
      const pill = opts.badge ? `<span class="method-pill ${opts.badge}">${opts.badgeText}</span>` : "";
      return `<div class="pay-method ${cls}"><div class="pay-method-head">${opts.title} ${pill}</div>${opts.body ? `<div class="pay-method-body">${opts.body}</div>` : ""}</div>`;
    }

    function productCheckoutSummary(s) {
      const btn =
        s.finalization === "after"
          ? state.rtl
            ? "تأیید و شروع سفر"
            : "Confirm & start trip"
          : state.rtl
          ? "پرداخت با ۴پی (OTP)"
          : "Pay with 4pay (OTP)";
      const c = merchantContent(s);
      const itemName = state.rtl ? c.titleFa.split(" - ")[0] : c.titleEn;
      return `<div class="summary-box"><h4>${state.rtl ? "خلاصه سفارش" : "Order summary"}</h4><div class="sum-row"><span>${itemName}</span><span>${c.price || BASKET_FMT}</span></div><div class="sum-row"><span>${state.rtl ? "ارسال" : "Shipping"}</span><span>${state.rtl ? "رایگان" : "Free"}</span></div><div class="sum-row total"><span>${state.rtl ? "جمع" : "Total"}</span><span>${c.price || BASKET_FMT}</span></div><div class="sum-note dp">${state.rtl ? "با ۴پی: پرداخت در ۴ قسط مساوی" : "With 4pay: split into 4 installments"}</div><button type="button" class="confirm-btn">${btn}</button></div>`;
    }

    function serviceCheckoutSummary(s) {
      const c = merchantContent(s);
      return `<div class="summary-box"><h4>${state.rtl ? "خلاصه سرویس" : "Service summary"}</h4><div class="sum-row"><span>${state.rtl ? "برآورد فعلی" : "Current estimate"}</span><span>${state.rtl ? c.estimateFa.split(": ")[1] : c.estimateEn.split(": ")[1]}</span></div><div class="sum-row"><span>${state.rtl ? "رزرو اعتبار" : "Credit hold"}</span><span>${s.trusted ? fmt(CREDIT_HEAD, true) : state.rtl ? "سقف فعال" : "Ceiling active"}</span></div><div class="sum-note dp">${state.rtl ? "مبلغ نهایی بعد از اتمام سرویس محاسبه و برداشت می‌شود." : "Final amount is captured after service completion."}</div><button type="button" class="confirm-btn">${state.rtl ? "تأیید و ادامه" : "Authorize and continue"}</button></div>`;

    function legendText(s) {
      const parts = [];
      if (isLow(s)) parts.push(state.rtl ? "کد کم: فقط دکمه/صفحه میزبانی‌شده — بدون API موجودی." : "Low code: hosted button only — no balance APIs on merchant app.");
      else if (isMid(s)) parts.push(state.rtl ? "کد متوسط: ویجت iframe/SDK برای بلوک دیجی‌پی." : "Mid code: Digipay iframe/SDK widget for the payment block.");
      else parts.push(state.rtl ? "کد زیاد: API کامل در UX فروشنده." : "More code: full API-driven UX on merchant pages.");
      if (!s.trusted) parts.push(state.rtl ? "غیرمورداعتماد: فقط کافی/ناکافی، بدون عدد." : "Not trusted: sufficiency booleans only, no balance figures.");
      if (isService(s)) parts.push(state.rtl ? "پس از تسویه: ۱پی معمولاً مخفی (بدون uplift)." : "After-checkout: 1pay typically hidden (no uplift for variable amount).");
      return parts.join(" ");
    }

    function openDocPage(serviceName) {
      state.selectedService = serviceName;
      const target = `digipay-technical-docs.html?page=${encodeURIComponent(state.page)}&service=${encodeURIComponent(serviceName)}&segment=${encodeURIComponent(state.segmentId)}&level=${encodeURIComponent(state.level)}`;
      window.location.href = target;
    }

    function closeDocPage() {
      state.docOpen = false;
      $("#docPage").classList.remove("open");
    }

    function renderDocPage() {
      const pageServices = getPageServices()[state.page] || [];
      if (!pageServices.length) return;
      if (!pageServices.includes(state.selectedService)) state.selectedService = pageServices[0];
      const doc = serviceDoc(state.selectedService);
      if (!doc) return;

      $("#docSidebarTitle").textContent = state.rtl ? "سرویس‌های این صفحه" : "Page services";
      $("#docNavList").innerHTML = pageServices
        .map((svc) => `<button class="doc-nav-item ${svc === state.selectedService ? "active" : ""}" data-doc-service="${svc}">${svc}</button>`)
        .join("");

      $("#docServiceTitle").textContent = state.selectedService;
      $("#docServiceSubtitle").innerHTML = `<span class="doc-badge">${doc.method}</span><span class="doc-badge">${doc.endpoint}</span>`;
      $("#docOverview").textContent = doc.overview || "";
      $("#docRequestMeta").innerHTML = `
        <div class="doc-kv"><strong>Auth</strong><span>${doc.auth}</span></div>
        <div class="doc-kv"><strong>Request model</strong><span>${doc.request}</span></div>`;
      $("#docRequestCode").textContent = doc.reqExample || "";
      $("#docResponseCode").textContent = doc.resExample || "";
      $("#docUx").textContent = doc.ux || "";
      $("#docTrust").textContent = doc.trusted || "";
      $("#docErrors").innerHTML = (doc.errors || []).map((e) => `<li>${e}</li>`).join("");
      $("#docChecklist").innerHTML = (doc.checklist || []).map((e) => `<li>${e}</li>`).join("");
      $("#docEvents").innerHTML = (doc.events || []).map((e) => `<li><code>${e}</code></li>`).join("");
      $("#docPage").classList.add("open");

      document.querySelectorAll(".doc-nav-item").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.selectedService = btn.dataset.docService;
          renderDocPage();
        });
      });
    }

        <span class="badge">${s.dev} code</span>
        <span class="badge">${s.trusted ? "Trusted" : "Not trusted"}</span>
        <span class="badge ${s.finalization === "after" ? "warn" : ""}">${s.finalization === "at" ? "At checkout" : "After checkout"}</span>
        <span class="badge ${state.level === "2" ? "lock" : state.level === "0" ? "warn" : ""}">Level ${state.level}</span>`;
      $("#segMeta").innerHTML = `<strong>${s.merchant}</strong><br/>${s.example}<br/><br/>${legendText(s)}`;

      let body = "";
      if (state.page === "pdp") body = renderPDP(s, state.level);
      else if (state.page === "plp") body = renderPLP(s, state.level);
      else body = renderCheckout(s, state.level);

      $("#frame").innerHTML = body;
      $("#legend").innerHTML = `<strong>${state.rtl ? "یادداشت کشف" : "Discovery note"}:</strong> ${legendText(s)}<ul>
        <li>${state.rtl ? "سطح ۰: CTA درخواست اعتبار با ارجاع به سبد فعلی" : "L0: Apply CTA tied to current basket value"}</li>
        <li>${state.rtl ? "سطح ۱: پیشنهاد ۴پی/۱پی/کیف پول بر اساس کافی بودن" : "L1: Recommend 4pay / 1pay / Wallet by sufficiency"}</li>
        <li>${state.rtl ? "سطح ۲: بازپرداخت → بازگشت؛ کیف پول همچنان فعال (سیاست)" : "L2: Repay → return; Wallet stays available (policy)"}</li>
      </ul>`;

      const pageServices = getPageServices();
      const title = state.rtl ? "سرویس‌های موردنیاز این صفحه (برای مشاهده مستند کلیک کنید)" : "Services for this page (click to open docs)";
      const services = pageServices[state.page];
      if (!services.includes(state.selectedService)) state.selectedService = services[0];
      const selectedDoc = serviceDoc(state.selectedService);
      $("#serviceListBox").innerHTML = `
        <h4>${title}</h4>
        ${services.map((svc) => `<button type="button" class="svc-btn ${svc === state.selectedService ? "active" : ""}" data-service="${svc}">${svc}</button>`).join("")}
        <div class="service-doc-box">
          ${selectedDoc ? `
            <h5>${state.rtl ? "مستند فنی سرویس" : "Technical integration doc"}: ${state.selectedService}</h5>
            <div class="doc-line"><strong>${state.rtl ? "Endpoint:" : "Endpoint:"}</strong> <code>${selectedDoc.endpoint}</code></div>
            <div class="doc-line"><strong>${state.rtl ? "Auth:" : "Auth:"}</strong> ${selectedDoc.auth}</div>
            <div class="doc-line"><strong>${state.rtl ? "Request:" : "Request:"}</strong> <code>${selectedDoc.request}</code></div>
            <div class="doc-line"><strong>${state.rtl ? "Response:" : "Response:"}</strong> <code>${selectedDoc.response}</code></div>
            <div class="doc-line"><strong>${state.rtl ? "Trusted/NotTrusted:" : "Trusted/NotTrusted:"}</strong> ${selectedDoc.trusted}</div>
            <div class="doc-line"><strong>${state.rtl ? "UX usage:" : "UX usage:"}</strong> ${selectedDoc.ux}</div>
          ` : `<div class="doc-line">${state.rtl ? "مستندی یافت نشد." : "No doc available."}</div>`}
        </div>`;
      document.querySelectorAll(".svc-btn").forEach((btn) => {
        btn.addEventListener("click", () => openDocPage(btn.dataset.service));
      });
    }

    initSelectors();
    $("#docCloseBtn").addEventListener("click", closeDocPage);
    render();
  </script>
</body>
</html>
